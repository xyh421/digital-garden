<!doctype html>
<html lang="zh-CN" data-palette="ice">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LAOXU OS，老徐的个人数字桌面。">
  <meta name="theme-color" content="#e9eff7">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/desktop.css">
  <script src="assets/desktop.js" defer></script>
  <title>LAOXU OS 2.0 · 老徐的数字桌面</title>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <div class="desktop">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LAOXU OS 首页">
        <span class="brand-icon" aria-hidden="true">✳</span>
        <span>LAOXU OS <small>2.0</small></span>
      </a>
      <div class="top-actions">
        <time class="clock" id="clock"></time>
        <button class="theme-trigger" id="theme-trigger" type="button" aria-haspopup="dialog">
          <span class="theme-dot" aria-hidden="true"></span><span id="theme-name">冰蓝流光</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>

    <main>
      <div class="desktop-heading">
        <h1>数字桌面</h1>
      </div>

      <div class="bento">
        <a class="panel garden" href="archive.html">
          <span class="garden-art" aria-hidden="true"></span>
          <span class="arrow corner" aria-hidden="true">↗</span>
          <span class="garden-copy">
            <span class="tile-title">数字花园</span>
            <span class="tile-description">记录工作、生活与值得留下的想法。</span>
            <span class="garden-action" aria-hidden="true">打开花园 <span>→</span></span>
          </span>
        </a>

        <a class="panel playbook" href="series/dads-playbook/index.html">
          <span class="widget-icon book" aria-hidden="true"></span>
          <span class="arrow corner" aria-hidden="true">↗</span>
          <span class="feature-copy">
            <span class="tile-title" lang="en">Dad's Playbook</span>
            <span class="tile-description">从待产到新手育儿的实用手册。</span>
          </span>
        </a>

        <a class="panel food" href="https://food.laoxu.org/" target="_blank" rel="noopener noreferrer">
          <span class="widget-icon plate" aria-hidden="true"></span>
          <span class="arrow corner" aria-hidden="true">↗</span>
          <span class="feature-copy">
            <span class="tile-title">好好吃饭</span>
            <span class="tile-description">家庭食谱 · 每周菜单 · 买菜清单</span>
          </span>
        </a>

        <nav class="tools" aria-labelledby="tools-heading">
          <h2 id="tools-heading">应用</h2>
          <div class="dock">
            <a class="app resume" href="https://laoxu.org/" target="_blank" rel="noopener noreferrer">
              <span class="app-icon" aria-hidden="true"><span class="person"></span></span>
              <span>个人简历</span>
            </a>
            <a class="app finance" href="https://finance.laoxu.org/" target="_blank" rel="noopener noreferrer">
              <span class="app-icon" aria-hidden="true"><span class="chart"></span></span>
              <span>金融市场</span>
            </a>
            <a class="app github" href="https://github.com/xyh421" target="_blank" rel="noopener noreferrer">
              <span class="app-icon" aria-hidden="true">&lt;/&gt;</span>
              <span>GitHub</span>
            </a>
            <a class="app warehouse" href="games/warehouse-control.html">
              <span class="app-icon" aria-hidden="true"><span class="robot"></span></span>
              <span>机器人调度挑战</span>
            </a>
            <a class="app snake" href="games/snake.html">
              <span class="app-icon" aria-hidden="true"><span class="pixels"></span></span>
              <span>贪吃蛇</span>
            </a>
          </div>
        </nav>
      </div>
    </main>

    <footer class="footer"><span>© LAOXU OS</span><span>laoxu89.com</span></footer>
  </div>

  <dialog id="themes" aria-labelledby="themes-heading">
    <div class="theme-panel">
      <div class="theme-heading">
        <h2 id="themes-heading">桌面主题</h2>
        <form method="dialog"><button class="close" type="submit" aria-label="关闭主题面板">×</button></form>
      </div>
      <div class="theme-options" id="theme-options"></div>
    </div>
  </dialog>
</body>
</html>
