<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0e17"><title>LAOXU. SNAKE — Arcade</title><style>:root{color-scheme:dark;--bg:#090d16;--line:#263246;--green:#a5ffcb;--muted:#91a1b8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#18283c 0,#090d16 65%);color:#e9f3ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:100vh}a{color:inherit;text-decoration:none}.wrap{max-width:1000px;margin:auto;padding:28px 22px 55px}header{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}header strong{color:white;letter-spacing:2px}.eyebrow{margin:65px 0 10px;color:var(--green);font-size:12px;letter-spacing:4px}.heading{display:flex;align-items:end;justify-content:space-between;gap:20px;flex-wrap:wrap}.heading h1{font-size:clamp(48px,9vw,100px);letter-spacing:-7px;line-height:1;margin:0;text-shadow:0 0 45px #6cf9aa50}.heading p{font-size:12px;color:var(--muted);line-height:1.8}.panel{margin-top:28px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:22px}.screen{position:relative;padding:13px;border:1px solid #33485c;border-radius:20px;background:#0d1622;box-shadow:0 25px 100px #0008,0 0 55px #55ff9d10;overflow:hidden}.screen:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0px,#0000 3px,#0002 4px);pointer-events:none;z-index:2}canvas{display:block;width:100%;aspect-ratio:1;background:#0a1420;border-radius:12px;touch-action:none}.overlay{position:absolute;inset:13px;display:grid;place-content:center;text-align:center;background:#07121cbd;z-index:3;border-radius:12px;padding:20px}.overlay[hidden]{display:none}.overlay h2{font-size:clamp(24px,5vw,42px);margin:0 0 12px;letter-spacing:-1px}.overlay p{color:#b7c9d7;font-size:13px;line-height:1.8}.btn{background:var(--green);color:#092019;border:0;border-radius:9px;padding:14px 21px;font-weight:800;font:inherit;cursor:pointer}.btn:hover{filter:brightness(1.1)}.side{display:flex;flex-direction:column;gap:14px}.stat,.info{border:1px solid var(--line);border-radius:15px;background:#111a29;padding:20px}.stat small{font-size:11px;color:var(--muted);letter-spacing:2px}.stat b{display:block;color:var(--green);font-size:40px;margin-top:10px}.info{font-size:12px;color:var(--muted);line-height:2}.info strong{color:white}.row{display:flex;gap:8px}.row button{flex:1;border:1px solid #35465a;border-radius:9px;background:#152334;color:white;padding:13px 5px;cursor:pointer}.controls{display:none;grid-template-columns:repeat(3,60px);gap:8px;justify-content:center;margin-top:22px}.controls button{height:54px;border:1px solid #3a5e60;border-radius:12px;background:#172b35;color:var(--green);font-size:22px;touch-action:manipulation}.controls button:active{background:#284c4c}.foot{margin-top:30px;font-size:11px;color:#7b8fa5;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}@media(max-width:700px){.panel{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.info{grid-column:1/-1}.controls{display:grid}.eyebrow{margin-top:40px}.heading h1{letter-spacing:-4px}.stat b{font-size:30px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}</style></head><body><div class="wrap"><header><a href="../index.html"><strong>LAOXU.</strong> / DIGITAL GARDEN</a><span>ARCADE / 001</span></header><div class="eyebrow">● INSERT COIN · PRESS START</div><div class="heading"><h1>SNAKE<span style="color:var(--green)">.</span></h1><p>一条贪吃的蛇。<br>一场没有终点的游戏。</p></div><div class="panel"><div class="screen"><canvas id="game" width="600" height="600" aria-label="贪吃蛇游戏画布"></canvas><div class="overlay" id="overlay"><h2 id="overlayTitle">READY, PLAYER ONE?</h2><p id="overlayText">方向键 / WASD 移动<br>吃掉光点，别撞到自己。</p><div><button class="btn" id="start">开始游戏 ↗</button></div></div></div><aside class="side"><div class="stat"><small>SCORE</small><b id="score">000</b></div><div class="stat"><small>PERSONAL BEST</small><b id="best">000</b></div><div class="info"><strong>HOW TO PLAY</strong><br>↑ ↓ ← → / WASD<br>空格键：暂停 / 继续<br>手机：滑动或下方方向键<br><br><span style="color:var(--green)">●</span> 吃到光点 +10 分<br>碰到边界或自己：结束</div><div class="row"><button id="pause">暂停</button><button id="restart">重开</button><button id="sound" aria-pressed="false">音效：关</button></div></aside></div><div class="controls" aria-label="手机方向控制"><span></span><button data-dir="up" aria-label="向上">↑</button><span></span><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button></div><div class="foot"><span>NO TRACKING · NO SERVER · JUST PLAY.</span><a href="../index.html">← 返回数字花园</a></div></div><script>(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),N=20,S=30;let snake,dir,next,food,score=0,best=0,running=false,paused=false,ended=false,last=0,raf=0,sound=false,audio;const el=id=>document.getElementById(id);try{best=Number(localStorage.getItem('laoxu-snake-best'))||0}catch(e){}el('best').textContent=String(best).padStart(3,'0');function tone(freq=450){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.13)}catch(e){}}function spawn(){let cells=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(p=>p.x===x&&p.y===y))cells.push({x,y});return cells.length?cells[Math.floor(Math.random()*cells.length)]:null}function reset(){snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next={...dir};food=spawn();score=0;running=true;paused=false;ended=false;last=0;el('score').textContent='000';el('pause').textContent='暂停';el('overlay').hidden=true;draw();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function finish(won=false){running=false;ended=true;el('overlayTitle').textContent=won?'PERFECT RUN!':'GAME OVER';el('overlayText').textContent='本局得分 '+score+' · 再来一局？';el('start').textContent='再玩一次 ↗';el('overlay').hidden=false;tone(170)}function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=food&&h.x===food.x&&h.y===food.y;const body=eat?snake:snake.slice(0,-1);if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(p=>p.x===h.x&&p.y===h.y)){finish();return}snake.unshift(h);if(eat){score+=10;el('score').textContent=String(score).padStart(3,'0');if(score>best){best=score;el('best').textContent=String(best).padStart(3,'0');try{localStorage.setItem('laoxu-snake-best',String(best))}catch(e){}}tone(530+score*2);food=spawn();if(!food){finish(true);return}}else snake.pop()}function draw(){ctx.clearRect(0,0,600,600);ctx.fillStyle='#0a1420';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#172838';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*S,0);ctx.lineTo(i*S,600);ctx.moveTo(0,i*S);ctx.lineTo(600,i*S);ctx.stroke()}if(food){let x=food.x*S+15,y=food.y*S+15;ctx.shadowColor='#7dffc5';ctx.shadowBlur=20;ctx.fillStyle='#a5ffcb';ctx.beginPath();ctx.arc(x,y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#d3ffe8':'#67d9a9';ctx.fillRect(p.x*S+2,p.y*S+2,S-4,S-4);if(i===0){ctx.fillStyle='#11372c';ctx.fillRect(p.x*S+11,p.y*S+10,4,4);ctx.fillRect(p.x*S+19,p.y*S+10,4,4)}})}function loop(t){if(!running)return;if(!paused&&(!last||t-last>Math.max(75,155-Math.floor(score/50)*8))){last=t;step()}draw();if(running)raf=requestAnimationFrame(loop)}function turn(x,y){if(!running||paused)return;if(x===-dir.x&&y===-dir.y)return;next={x,y}}function togglePause(){if(!running)return;paused=!paused;el('pause').textContent=paused?'继续':'暂停';el('overlayTitle').textContent='PAUSED';el('overlayText').textContent='休息一下，按空格继续';el('start').textContent='继续游戏 ↗';el('overlay').hidden=!paused}el('start').onclick=()=>paused?togglePause():reset();el('restart').onclick=reset;el('pause').onclick=togglePause;el('sound').onclick=()=>{sound=!sound;el('sound').textContent='音效：'+(sound?'开':'关');el('sound').setAttribute('aria-pressed',String(sound));if(sound)tone()};const dirs={ArrowUp:[0,-1],KeyW:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};document.addEventListener('keydown',e=>{if(dirs[e.code]){e.preventDefault();if(!running&&!paused)reset();turn(...dirs[e.code])}else if(e.code==='Space'){e.preventDefault();if(!running&&!paused)reset();else togglePause()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};if(!running&&!paused)reset();turn(...m[b.dataset.dir])}));let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(!running&&!paused)reset();if(Math.abs(dx)>Math.abs(dy))turn(Math.sign(dx),0);else turn(0,Math.sign(dy))},{passive:true});snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];food={x:14,y:10};draw()})();</script></body></html>
