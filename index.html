<!doctype html>
<html lang="zh-CN" data-palette="graphite">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LAOXU OS，老徐的个人数字桌面。">
  <meta name="theme-color" content="#121615">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="assets/desktop.css">
  <script src="assets/desktop.js" defer></script>
  <title>LAOXU OS 2.0 · 老徐的数字桌面</title>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <div class="desktop">
    <header class="topbar">
      <a class="brand" href="./" aria-label="LAOXU OS 首页">
        <span class="brand-icon" aria-hidden="true">✳</span>
        <span>LAOXU OS <small>2.0</small></span>
      </a>
      <div class="top-actions">
        <time class="clock" id="clock"></time>
        <button class="theme-trigger" id="theme-trigger" type="button" aria-haspopup="dialog">
          <span class="theme-dot" aria-hidden="true"></span><span id="theme-name">石墨银雾</span>
          <span aria-hidden="true">⌄</span>
        </button>
      </div>
    </header>

    <main>
      <div class="desktop-heading">
        <h1>数字桌面</h1>
        <span>老徐的个人空间</span>
      </div>

      <div class="bento">
        <a class="panel garden" href="archive.html">
          <span class="garden-art" aria-hidden="true"></span>
          <span class="garden-top"><span class="section-label">DIGITAL GARDEN</span><span class="arrow" aria-hidden="true">↗</span></span>
          <span class="garden-copy">
            <span class="tile-title">数字花园</span>
            <span class="tile-description">记录工作、生活与值得留下的想法。</span>
            <span class="garden-action" aria-hidden="true">走进花园 <span>→</span></span>
          </span>
        </a>

        <a class="panel playbook" href="series/dads-playbook/index.html">
          <span class="section-label">家庭手记</span>
          <span class="arrow corner" aria-hidden="true">↗</span>
          <span class="book" aria-hidden="true"><span>Dad’s<br>Playbook</span><span class="book-rule"></span></span>
          <span class="feature-copy">
            <span class="tile-title" lang="en">Dad's Playbook</span>
            <span class="tile-description">从待产到新手育儿的实用手册。</span>
          </span>
        </a>

        <nav class="panel tools" aria-labelledby="tools-heading">
          <h2 id="tools-heading" class="section-label">常用应用</h2>
          <a class="app-row resume" href="https://laoxu.org/" target="_blank" rel="noopener noreferrer">
            <span class="app-icon" aria-hidden="true">ID</span>
            <span><strong>个人简历</strong><small>职业经历与项目</small></span>
            <span class="row-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="app-row finance" href="https://finance.laoxu.org/" target="_blank" rel="noopener noreferrer">
            <span class="app-icon" aria-hidden="true">↗</span>
            <span><strong>金融市场</strong><small>全球市场与周线行情</small></span>
            <span class="row-arrow" aria-hidden="true">↗</span>
          </a>
          <a class="app-row github" href="https://github.com/xyh421" target="_blank" rel="noopener noreferrer">
            <span class="app-icon" aria-hidden="true">&lt;/&gt;</span>
            <span><strong>GitHub</strong><small>代码与开源项目</small></span>
            <span class="row-arrow" aria-hidden="true">↗</span>
          </a>
        </nav>

        <section class="panel arcade" aria-labelledby="arcade-heading">
          <h2 id="arcade-heading" class="section-label">游戏厅</h2>
          <div class="arcade-grid">
            <a class="game warehouse" href="games/warehouse-control.html">
              <span class="game-icon robot" aria-hidden="true"></span>
              <span class="row-arrow" aria-hidden="true">↗</span>
              <strong>机器人调度挑战</strong><small>仓储调度</small>
            </a>
            <a class="game snake" href="games/snake.html">
              <span class="game-icon pixels" aria-hidden="true"></span>
              <span class="row-arrow" aria-hidden="true">↗</span>
              <strong>贪吃蛇</strong><small>经典街机</small>
            </a>
          </div>
        </section>

        <a class="panel food" href="https://food.laoxu.org/" target="_blank" rel="noopener noreferrer">
          <span class="section-label">家庭厨房</span>
          <span class="arrow corner" aria-hidden="true">↗</span>
          <span class="plate" aria-hidden="true"></span>
          <span class="feature-copy">
            <span class="tile-title">好好吃饭</span>
            <span class="tile-description">家庭食谱 · 每周菜单 · 买菜清单</span>
          </span>
        </a>
      </div>
    </main>

    <footer class="footer"><span>© LAOXU OS</span><span>laoxu89.com</span></footer>
  </div>

  <dialog id="themes" aria-labelledby="themes-heading">
    <div class="theme-panel">
      <div class="theme-heading">
        <h2 id="themes-heading">桌面主题</h2>
        <form method="dialog"><button class="close" type="submit" aria-label="关闭主题面板">×</button></form>
      </div>
      <div class="theme-options" id="theme-options"></div>
    </div>
  </dialog>
</body>
</html>
