<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-label="第一产程｜宫颈扩张是渐进过程"><rect width="1000" height="510" rx="28" fill="#F5F3EF"/><text x="48" y="63" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24282B">第一产程｜宫颈扩张是渐进过程</text><g font-family="Arial,sans-serif" text-anchor="middle"><circle cx="150" cy="225" r="88" fill="#F0DCD7" stroke="#C9978D" stroke-width="7"/><circle cx="150" cy="225" r="8" fill="#F5F3EF" stroke="#B9827A" stroke-width="5"/><text x="150" y="355" font-size="23" fill="#272727">未明显扩张</text><circle cx="380" cy="225" r="88" fill="#F0DCD7" stroke="#C9978D" stroke-width="7"/><circle cx="380" cy="225" r="24" fill="#F5F3EF" stroke="#B9827A" stroke-width="5"/><text x="380" y="355" font-size="23" fill="#272727">逐渐扩张</text><circle cx="610" cy="225" r="88" fill="#F0DCD7" stroke="#C9978D" stroke-width="7"/><circle cx="610" cy="225" r="49" fill="#F5F3EF" stroke="#B9827A" stroke-width="5"/><text x="610" y="355" font-size="23" fill="#272727">持续扩张</text><circle cx="840" cy="225" r="88" fill="#F0DCD7" stroke="#C9978D" stroke-width="7"/><circle cx="840" cy="225" r="78" fill="#F5F3EF" stroke="#B9827A" stroke-width="5"/><text x="840" y="355" font-size="23" fill="#272727">约10厘米开全</text><text x="500" y="409" font-size="18" fill="#727578">示意宫颈开口变化，不代表固定时间或逐厘米匀速进展</text></g><text x="48" y="474" font-family="Arial,sans-serif" font-size="16" fill="#73777B">LAOXU.  /  BECOMING PARENTS  ·  简化科普示意，非真实解剖比例</text></svg>